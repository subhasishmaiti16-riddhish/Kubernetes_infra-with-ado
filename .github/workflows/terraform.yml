name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: parent

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Select Azure Client ID based on branch
      - name: Select Azure Client ID
        id: azure-client
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "client_id=${{ vars.AZURE_MAIN_CLIENT_ID }}" >> "$GITHUB_OUTPUT"
          else
            echo "client_id=${{ vars.AZURE_FEATURE_CLIENT_ID }}" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Debug Azure Configuration
        run: |
          echo "Branch: ${GITHUB_REF}"
          echo "Client ID: ${{ steps.azure-client.outputs.client_id }}"
          echo "Tenant ID: ${{ vars.AZURE_TENANT_ID }}"
          echo "Subscription ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}"

      # 4. Azure OIDC Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ steps.azure-client.outputs.client_id }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 5. Check Azure Login
      - name: Azure Account
        run: az account show

      # 6. Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # 7. Terraform Format Check
      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      # 8. Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # 8.5. Security Scan
      - name: Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: true
          
      # 9. Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan

      
      # 10. Apply ONLY on main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve