apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-deployment
  # labels:
  #   app: netflix
spec:
  replicas: 2
  selector:
    matchLabels:
      name: netflix
  template:
    metadata:
      labels:
        name: netflix
    spec:
      containers:
      - name: netflix
        image: devopsinsiders/netflix-clone
        ports:
        - containerPort: 80
