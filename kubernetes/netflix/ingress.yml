apiVersion: networking.k8s.io/v1   # Kubernetes API Group + API Version
kind: Ingress
metadata:
  name: netflix-ingress
  # annotations:
  #   appgw.ingress.kubernetes.io/backend-path-prefix: "/"
spec:
  ingressClassName: azure-application-gateway   # Azure Application Gateway Ingress Controller (AGIC) handle করবে 

  rules:
  - host: netflix.subhasish.study     # Domain name
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: netflix
            port:
              number: 80
