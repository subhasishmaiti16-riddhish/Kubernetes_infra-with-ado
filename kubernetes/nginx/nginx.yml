apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui-deployment
  # labels:
  #   app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      name: axion-ui
  template:
    metadata:
      labels:
        name: axion-ui
    spec:
      containers:
      - name: axion-ui
        image: devopsinsiders/axion-ui
        ports:
        - containerPort: 80
